name: Build check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vira_dev
          POSTGRES_PASSWORD: vira_dev_only_change_me
          POSTGRES_DB: vira_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vira_dev -d vira_shop"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vira_dev:vira_dev_only_change_me@127.0.0.1:5432/vira_shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
      - name: Test API against PostgreSQL
        run: |
          npm run start -- --port 3000 > /tmp/vira-server.log 2>&1 &
          node scripts/smoke-api.mjs || (cat /tmp/vira-server.log && exit 1)

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Windows startup script
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\start-windows.ps1 -CheckOnly
