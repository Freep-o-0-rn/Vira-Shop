name: Build and embedded database check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/test-catalog-route.mjs
      - run: node --experimental-strip-types scripts/test-admin-form.mjs
      - run: node --experimental-strip-types scripts/test-variant-selection.mjs
      - run: node --experimental-strip-types scripts/test-logistics.mjs
      - run: npm run typecheck
      - run: npm run build

  local-database:
    runs-on: ubuntu-latest
    env:
      VIRA_ADMIN_LOGIN: testadmin
      VIRA_ADMIN_PASSWORD: test-only-strong-password-123
      APP_ORIGIN: http://127.0.0.1:3000
      VIRA_LOCAL_UPLOADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run admin:create
      - name: Verify administrator password reset does not alter the database
        run: npm run admin:create
      - run: npm run typecheck
      - run: npm run build
      - name: API integration tests (embedded local DB)
        run: |
          npm run start -- --port 3000 > /tmp/vira-server.log 2>&1 &
          echo "Testing admin API"
          timeout 110s node scripts/smoke-admin.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing catalog API"
          timeout 190s node scripts/smoke-catalog.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing customer order API"
          timeout 120s node scripts/smoke-buyers.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing SKU variants and checkout"
          timeout 120s node scripts/smoke-variants.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing admin inventory, SKU cloning and bulk updates"
          timeout 120s node scripts/smoke-inventory.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing fulfillment and payment-disabled checkout"
          timeout 120s node scripts/smoke-fulfillment.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing order management audit trail and concurrent cancellations"
          timeout 120s node scripts/smoke-orders-workflow.mjs || (cat /tmp/vira-server.log && exit 1)
          echo "Testing logistics, courier handoffs and Ozon fail-closed"
          timeout 120s node scripts/smoke-logistics.mjs || (cat /tmp/vira-server.log && exit 1)

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Windows startup script
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\start-windows.ps1 -CheckOnly
      - name: Validate Windows photo cache script (offline)
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\cache-demo-images-windows.ps1 -CheckOnly
      - name: Install application dependencies on Windows
        run: npm install --no-audit --no-fund
      - name: Verify Windows data transfer, backup and locked database protection
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\test-data-transfer-windows.ps1
      - name: Initialize embedded database on Windows
        run: npm run db:seed
      - name: Repeat initialization without destroying data
        run: npm run db:seed
