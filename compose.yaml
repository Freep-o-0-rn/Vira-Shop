# LOCAL DEVELOPMENT ONLY. Database port is bound to loopback, not the public internet.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vira_dev
      POSTGRES_PASSWORD: vira_dev_only_change_me
      POSTGRES_DB: vira_shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vira_dev -d vira_shop"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vira_pgdata:
